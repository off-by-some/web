name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - run: npm run verify

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: site-build
          path: build/
          retention-days: 1

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install

      # Builds fresh in this job rather than reusing another job's build/
      # artifact - vite preview (via SvelteKit's plugin) also needs
      # .svelte-kit/output/server, which isn't part of that static artifact
      # and was previously only available here through a cache that turned
      # out to serve stale content. Storybook is skipped since Lighthouse
      # only tests the main app.
      - run: npm run clean && npm run setup:static && npm run build:app

      - run: npm run lighthouse:run

      - name: Show Lighthouse diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Lighthouse environment ==="

          find metrics/lhci \
            -type f \
            -name '*.json' \
            -print0 |
          xargs -0 -r -n1 jq -r '
            select(type == "object" and .lighthouseVersion and .audits)
            | [
                (.fetchTime // "unknown"),
                .lighthouseVersion,
                .userAgent,
                (.environment.benchmarkIndex // "unknown" | tostring),
                .finalUrl
              ]
            | @tsv
          ' |
          sort -u

          echo
          echo "=== Render-blocking resources ==="

          find metrics/lhci \
            -type f \
            -name '*.json' \
            -print0 |
          xargs -0 -r -n1 jq -r '
            select(type == "object" and .audits)
            | . as $report
            | .audits
            | to_entries[]
            | select(.key | test("render-blocking"))
            | .key as $audit
            | .value.details
            | ..
            | objects
            | select(.url?)
            | [
                ($report.fetchTime // "unknown"),
                $audit,
                .url,
                ((.wastedMs // .duration // 0) | tostring),
                ((.totalBytes // 0) | tostring)
              ]
            | @tsv
          ' |
          sort -u

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: metrics/lhci
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - build
      - lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v7
        with:
          name: site-build
          path: build

      - name: Configure git identity
        run: |
          git config user.email "cassidybridges+automation@gmail.com"
          git config user.name "[Github Actions]"

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d build --dotfiles \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
