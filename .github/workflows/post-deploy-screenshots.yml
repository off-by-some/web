name: Post-deployment screenshots

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: post-pages-screenshots-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  SITE_URL: https://off-by-some.github.io/web/

jobs:
  screenshots:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployed source commit identity
        id: deployment
        run: |
          ROOT_SHA_URL="${SITE_URL%/}/sha"
          STORYBOOK_SHA_URL="${SITE_URL%/}/storybook/sha"

          for i in $(seq 1 30); do
            root_sha="$(curl -fsSL -H "Cache-Control: no-cache" "$ROOT_SHA_URL" 2>/dev/null | tr -d "[:space:]" || true)"
            storybook_sha="$(curl -fsSL -H "Cache-Control: no-cache" "$STORYBOOK_SHA_URL" 2>/dev/null | tr -d "[:space:]" || true)"

            if [ -n "$root_sha" ] && [ "$root_sha" = "$storybook_sha" ]; then
              if ! printf '%s' "$root_sha" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Deployed SHA is not a full git commit hash: $root_sha"
                exit 1
              fi

              echo "source_sha=$root_sha" >> "$GITHUB_OUTPUT"
              echo "Deployment identity verified: $root_sha"
              exit 0
            fi

            echo "Waiting for matching deployed source SHA ($i/30)..."
            echo "  $ROOT_SHA_URL -> ${root_sha:-not ready}"
            echo "  $STORYBOOK_SHA_URL -> ${storybook_sha:-not ready}"
            sleep 10
          done

          echo "Timed out waiting for matching deployed source SHA"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.deployment.outputs.source_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .bundle-stats is produced by the vite build itself (rollup-plugin-bundle-stats),
      # so it has to come from a local build rather than the deployed site.
      - name: Build app for bundle stats
        run: |
          npm run setup:static
          npm run build:app

      - name: Take screenshots
        run: npm run screenshot:all -- --url="$SITE_URL"

      - name: Commit and push screenshots
        run: |
          git config user.email "cassidybridges+automation@gmail.com"
          git config user.name "[Github Actions]"

          git add docs/bundle-stats-report.png docs/lighthouse-report.png docs/og-about.jpg docs/website-preview.png

          if git diff --cached --quiet; then
            echo "No screenshot or preview-image changes to commit"
            exit 0
          fi

          git commit -m "github-actions[bot]: Update deployment images"
          git push origin HEAD:main
