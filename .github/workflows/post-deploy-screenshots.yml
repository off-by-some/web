name: Post-deployment screenshots

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: post-pages-screenshots-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  SITE_URL: https://off-by-some.github.io/web/

jobs:
  screenshots:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .bundle-stats is produced by the vite build itself (rollup-plugin-bundle-stats),
      # so it has to come from a local build rather than the deployed site.
      - name: Build app for bundle stats
        run: |
          npm run setup:static
          npm run build:app

      - name: Verify deployed commit identity
        run: |
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
          ROOT_SHA_URL="${SITE_URL%/}/sha"
          STORYBOOK_SHA_URL="${SITE_URL%/}/storybook/sha"

          for i in $(seq 1 30); do
            root_sha="$(curl -fsSL -H "Cache-Control: no-cache" "$ROOT_SHA_URL" 2>/dev/null | tr -d "[:space:]" || true)"
            storybook_sha="$(curl -fsSL -H "Cache-Control: no-cache" "$STORYBOOK_SHA_URL" 2>/dev/null | tr -d "[:space:]" || true)"

            if [ "$root_sha" = "$EXPECTED_SHA" ] && [ "$storybook_sha" = "$EXPECTED_SHA" ]; then
              echo "Deployment identity verified: $EXPECTED_SHA"
              exit 0
            fi

            echo "Waiting for deployed SHA $EXPECTED_SHA ($i/30)..."
            echo "  $ROOT_SHA_URL -> ${root_sha:-not ready}"
            echo "  $STORYBOOK_SHA_URL -> ${storybook_sha:-not ready}"
            sleep 10
          done

          echo "Timed out waiting for deployment identity $EXPECTED_SHA"
          exit 1

      - name: Take screenshots
        run: npm run screenshot:all -- --url="$SITE_URL"

      - name: Commit and push screenshots
        run: |
          git config user.email "cassidybridges+automation@gmail.com"
          git config user.name "[Github Actions]"

          git add docs/bundle-stats-report.png docs/lighthouse-report.png docs/website-preview.png

          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi

          git commit -m "github-actions[bot]: Update screenshots from latest deployment"
          git push
