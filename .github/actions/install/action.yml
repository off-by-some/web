name: Install dependencies
description: Set up Node.js and install npm dependencies, restoring dependency and build caches where possible.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '24'

    # Everything `npm ci` produces — node_modules and Puppeteer's downloaded
    # browser (which lands outside node_modules, in ~/.cache/puppeteer) — lives
    # under one key so they can never restore out of sync with each other.
    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          ~/.cache/puppeteer
        key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # Keyed on the actual content that affects .svelte-kit's output, not just
    # package-lock.json - a source-only commit must invalidate this. No
    # restore-keys fallback: an exact match or a full miss, never a
    # different commit's stale build silently standing in.
    - name: Cache SvelteKit build cache
      uses: actions/cache@v5
      with:
        path: .svelte-kit
        key: build-cache-${{ runner.os }}-${{ hashFiles('src/**', 'svelte.config.js', 'vite.config.ts', 'tsconfig.json', 'package-lock.json') }}
